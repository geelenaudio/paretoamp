# Mini dev loop for Pareto Amp.
#
#   task                 # list all tasks
#   task fw:targets      # board → env → flash command
#   task fw:amped        # flash Amped-WROVER (software PEQ)
#   task fw:louder       # flash Louder-WROVER (TAS58xx HW PEQ)
#   task fw:factory      # merge a 0x0 factory image (app + SPIFFS; wipes NVS)
#   task snap:up         # start the snapcast server
#   task stream:desktop  # pipe desktop audio into the snapserver FIFO
#
# Requires `task` (go-task, https://taskfile.dev).
#
# PlatformIO env is compile-time: Amped images never talk to the TAS, so
# flashing the default onto a Louder board makes EQ look like "software".
# Prefer the named tasks. Generic fw:* still default to amped-esp32-idf.
#
# Overrides (both forms work):
#   task fw:upload PIO_ENV=louder-esp32-idf
#   PIO_ENV=louder-esp32-idf task fw:upload
#   task fw:louder PIO_PORT=/dev/ttyACM0
#
# pio is resolved from PATH, else ~/.platformio/penv/bin/pio.
version: "3"

vars:
  PIO:
    sh: command -v pio 2>/dev/null || echo "$HOME/.platformio/penv/bin/pio"
  # Shell env wins, then CLI `task … PIO_ENV=…`, else Amped-WROVER.
  PIO_ENV:
    sh: echo "${PIO_ENV:-amped-esp32-idf}"
  PIO_PORT:
    sh: echo "${PIO_PORT:-/dev/ttyUSB0}"
  FW_DIR: pareto-amp
  SNAP_DIR: snapcast-example
  SNAP_FIFO: snapcast-example/data/testfifo

tasks:
  default:
    desc: List every task with a one-line description
    cmds:
      - task --list

  # ---------- firmware --------------------------------------------------------

  fw:targets:
    desc: Show boards, PlatformIO envs, and the matching flash tasks
    silent: true
    cmds:
      - |
        cat <<'EOF'
        Board                         Task              PIO env              PEQ
        ----------------------------- ----------------- -------------------- -------------------
        Amped-ESP32 (WROVER)          task fw:amped     amped-esp32-idf      software (10 bands)
        Louder-ESP32-Plus (WROVER)    task fw:louder    louder-esp32-idf     TAS58xx HW (15)
        Amped-ESP32-S3                task fw:amped-s3  amped-esp32s3-idf    software (10 bands)
        Louder-ESP32-S3               task fw:louder-s3 louder-esp32s3-idf   TAS58xx HW (15)

        Port defaults to /dev/ttyUSB0. Override:  task fw:louder PIO_PORT=/dev/ttyACM0
        List serial devices:                      task fw:ports

        Generic fw:upload / fw:web / fw:monitor still need an explicit env on
        Louder/S3, otherwise they flash Amped:
          task fw:upload PIO_ENV=louder-esp32-idf
          PIO_ENV=louder-esp32-idf task fw:upload
        EOF

  fw:ports:
    desc: List serial devices PlatformIO can flash
    cmds:
      - "{{.PIO}} device list"

  fw:amped:
    desc: Flash Amped-ESP32 WROVER (software PEQ) — app + SPIFFS
    aliases: [flash:amped]
    cmds:
      - task: fw:flash
        vars: { PIO_ENV: amped-esp32-idf, PIO_PORT: "{{.PIO_PORT}}", PIO: "{{.PIO}}" }

  fw:louder:
    desc: Flash Louder-ESP32-Plus WROVER (TAS58xx HW PEQ) — app + SPIFFS
    aliases: [flash:louder]
    cmds:
      - task: fw:flash
        vars: { PIO_ENV: louder-esp32-idf, PIO_PORT: "{{.PIO_PORT}}", PIO: "{{.PIO}}" }

  fw:amped-s3:
    desc: Flash Amped-ESP32-S3 (software PEQ) — app + SPIFFS
    aliases: [flash:amped-s3]
    cmds:
      - task: fw:flash
        vars: { PIO_ENV: amped-esp32s3-idf, PIO_PORT: "{{.PIO_PORT}}", PIO: "{{.PIO}}" }

  fw:louder-s3:
    desc: Flash Louder-ESP32-S3 (TAS58xx HW PEQ) — app + SPIFFS
    aliases: [flash:louder-s3]
    cmds:
      - task: fw:flash
        vars: { PIO_ENV: louder-esp32s3-idf, PIO_PORT: "{{.PIO_PORT}}", PIO: "{{.PIO}}" }

  _fw_check:
    internal: true
    silent: true
    cmds:
      - |
        case "{{.PIO_ENV}}" in
          amped-esp32-idf|amped-esp32s3-idf|louder-esp32-idf|louder-esp32s3-idf) ;;
          *)
            echo "Unknown PIO_ENV={{.PIO_ENV}}"
            echo "Valid: amped-esp32-idf  amped-esp32s3-idf  louder-esp32-idf  louder-esp32s3-idf"
            echo "Or:    task fw:amped | fw:louder | fw:amped-s3 | fw:louder-s3"
            exit 2
            ;;
        esac

  _fw_banner:
    internal: true
    silent: true
    cmds:
      - task: _fw_check
        vars: { PIO_ENV: "{{.PIO_ENV}}" }
      - |
        echo
        echo ">>> {{.FW_ACTION}}  env={{.PIO_ENV}}  port={{.PIO_PORT}}"
        echo "    Amped = software PEQ (no TAS).  Louder = TAS58xx hardware PEQ."
        echo "    Named flash: task fw:amped | fw:louder | fw:amped-s3 | fw:louder-s3"
        echo

  fw:build:
    desc: Compile firmware for PIO_ENV (default Amped-WROVER; no upload)
    dir: "{{.FW_DIR}}"
    cmds:
      - task: _fw_banner
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
          FW_ACTION: build
      - "{{.PIO}} run -e {{.PIO_ENV}}"

  fw:upload:
    desc: Flash the app partition only (keeps SPIFFS). Default env is Amped.
    dir: "{{.FW_DIR}}"
    cmds:
      - task: _fw_banner
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
          FW_ACTION: "upload app"
      - "{{.PIO}} run -e {{.PIO_ENV}} -t upload --upload-port {{.PIO_PORT}}"

  fw:build:verbose:
    desc: "Compile with -DVERBOSE_AUDIO_LOG=1 (boot-prompt + drain diagnostics)"
    dir: "{{.FW_DIR}}"
    env:
      PLATFORMIO_BUILD_FLAGS: -DVERBOSE_AUDIO_LOG=1
    cmds:
      - task: _fw_banner
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
          FW_ACTION: "build verbose"
      - "{{.PIO}} run -e {{.PIO_ENV}}"

  fw:upload:verbose:
    desc: "Flash app with -DVERBOSE_AUDIO_LOG=1 (boot-prompt + drain diagnostics)"
    dir: "{{.FW_DIR}}"
    env:
      PLATFORMIO_BUILD_FLAGS: -DVERBOSE_AUDIO_LOG=1
    cmds:
      - task: _fw_banner
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
          FW_ACTION: "upload app verbose"
      - "{{.PIO}} run -e {{.PIO_ENV}} -t upload --upload-port {{.PIO_PORT}}"

  fw:web:
    desc: Bundle SPA (web/ → data/web/) + flash SPIFFS for PIO_ENV
    dir: "{{.FW_DIR}}"
    cmds:
      - task: _fw_banner
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
          FW_ACTION: "upload SPIFFS"
      - "{{.PIO}} run -e {{.PIO_ENV}} -t uploadfs --upload-port {{.PIO_PORT}}"

  fw:web-bundle:
    desc: Run the SPA bundler only (web/ -> data/web/ gzipped). No device touched.
    dir: "{{.FW_DIR}}"
    cmds:
      - python3 scripts/build_web.py

  fw:web-image:
    desc: Build the SPIFFS image (.pio/.../spiffs.bin), but don't flash it
    dir: "{{.FW_DIR}}"
    cmds:
      - task: _fw_check
        vars: { PIO_ENV: "{{.PIO_ENV}}" }
      - "{{.PIO}} run -e {{.PIO_ENV}} -t buildfs"
      - |
        img=$(ls -1 .pio/build/{{.PIO_ENV}}/*spiffs*.bin 2>/dev/null | head -n 1)
        [ -n "$img" ] && echo "SPIFFS image: $(pwd)/$img ($(stat -c %s "$img") bytes)"

  fw:factory:
    desc: Build app + SPIFFS and merge a factory 0x0 image (flashing it wipes NVS)
    dir: "{{.FW_DIR}}"
    cmds:
      - task: _fw_banner
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
          FW_ACTION: factory
      - "{{.PIO}} run -e {{.PIO_ENV}}"
      - "{{.PIO}} run -e {{.PIO_ENV}} -t buildfs"
      - python3 scripts/merge_factory.py --env {{.PIO_ENV}}

  fw:flash:
    desc: Flash app + SPIFFS for PIO_ENV (no monitor). Default env is Amped.
    cmds:
      - task: fw:upload
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
      - task: fw:web
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"

  fw:all:
    desc: Flash app + SPIFFS for PIO_ENV (same as fw:flash; does not attach monitor)
    cmds:
      - task: fw:flash
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"

  fw:all:verbose:
    desc: Flash verbose app + SPIFFS for PIO_ENV (no monitor)
    cmds:
      - task: fw:upload:verbose
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
      - task: fw:web
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"

  fw:monitor:
    desc: Serial monitor (115200, exception decoder). Pass PIO_ENV for Louder/S3.
    dir: "{{.FW_DIR}}"
    cmds:
      - task: _fw_banner
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
          FW_ACTION: monitor
      - "{{.PIO}} device monitor -e {{.PIO_ENV}} --port {{.PIO_PORT}}"

  fw:erase:
    desc: Erase the entire flash (nukes WiFi creds, EQ, presets — use sparingly)
    dir: "{{.FW_DIR}}"
    cmds:
      - task: _fw_banner
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
          FW_ACTION: erase
      - "{{.PIO}} run -e {{.PIO_ENV}} -t erase --upload-port {{.PIO_PORT}}"

  fw:clean:
    desc: Drop PlatformIO build cache for PIO_ENV
    dir: "{{.FW_DIR}}"
    cmds:
      - task: _fw_check
        vars: { PIO_ENV: "{{.PIO_ENV}}" }
      - "{{.PIO}} run -e {{.PIO_ENV}} -t clean"

  # ---------- snapcast server -------------------------------------------------

  snap:up:
    desc: Start snapserver + snapweb + librespot (docker compose, detached)
    dir: "{{.SNAP_DIR}}"
    cmds:
      - docker compose up -d
      - |
        echo
        echo "snapweb UI:        http://$(hostname -I | awk '{print $1}'):1780/"
        echo "Snapclient stream: tcp://$(hostname -I | awk '{print $1}'):1704"

  snap:down:
    desc: Stop and remove the snapcast container (keeps ./data)
    dir: "{{.SNAP_DIR}}"
    cmds:
      - docker compose down

  snap:logs:
    desc: Tail the snapserver/librespot log
    dir: "{{.SNAP_DIR}}"
    cmds:
      - docker compose logs -f snapcast

  snap:restart:
    desc: Restart snapserver (pick up edits to snapserver.conf)
    dir: "{{.SNAP_DIR}}"
    cmds:
      - docker compose restart snapcast

  snap:reset:
    desc: Wipe snapserver + librespot state (./data). DESTRUCTIVE.
    dir: "{{.SNAP_DIR}}"
    cmds:
      - docker compose down
      - rm -rf data
      - mkdir -p data

  # ---------- stream into the `Desktop` pipe source --------------------------
  # snapserver.conf has:
  #   source = pipe:////data/testfifo?name=Desktop&sampleformat=44100:16:2
  # Anything raw S16LE 44.1 kHz stereo piped into ./data/testfifo on the host
  # comes out as the `Desktop` Snapcast stream.

  stream:sources:
    desc: List PipeWire MONITOR sources (what you actually want for desktop audio)
    cmds:
      - |
        if command -v wpctl >/dev/null; then
          echo "Default monitor (always works): @DEFAULT_MONITOR@"
          echo
          echo "Or pick one of these explicitly (they all mirror a sink):"
          # Prefer pw-cli because `wpctl status` hides monitor sources by
          # default. Nodes of media.class = Audio/Source/Virtual with a
          # name ending in `.monitor` are sink-monitors — exactly what we
          # need. Fall back to a hint if pw-cli isn't available.
          if command -v pw-cli >/dev/null; then
            pw-cli ls Node 2>/dev/null | awk '
              /^[[:space:]]*id [0-9]+,/          { id = $2; sub(",","",id); next }
              /node\.name = ".*\.monitor"/       { name = $3; gsub("\"","",name); found=1 }
              /node\.description = ".*"/        {
                # Grab everything between the quotes so descriptions with spaces
                # survive.
                match($0, /"[^"]*"/); desc = substr($0, RSTART+1, RLENGTH-2)
              }
              /media\.class = "Audio\/Source\/Virtual"/ { isvirt=1 }
              /^$/ {
                if (found && isvirt) {
                  printf "  %-5s %-70s %s\n", id, name, desc
                }
                id=""; name=""; desc=""; found=0; isvirt=0
              }
            '
          else
            echo "  (install pw-cli for a full monitor list; in the meantime,"
            echo "   each sink below has a monitor named '<node.name>.monitor')"
          fi
          echo
          echo "Underlying sinks (for reference):"
          wpctl status | sed -n '/Audio/,/Video/p' | sed -n '/Sinks:/,/Sources:/p'
          echo
          echo "Usage:"
          echo "  task stream:desktop                           # auto: @DEFAULT_MONITOR@"
          echo "  task stream:desktop -- @DEFAULT_MONITOR@      # same thing, explicit"
          echo "  task stream:desktop -- <monitor.node.name>    # pick one from above"
        elif command -v pactl >/dev/null; then
          pactl list sources short | grep -E "monitor"
        else
          echo "Neither wpctl (PipeWire) nor pactl (PulseAudio) is installed."
          exit 1
        fi

  stream:desktop:
    desc: "Pipe desktop audio into the Desktop FIFO. Default: monitor of the system-default sink."
    cmds:
      - mkdir -p {{.SNAP_DIR}}/data
      - |
        # IMPORTANT: we intentionally do NOT use `pw-record` here.
        #
        # pw-record writes its output via libsndfile, which picks the
        # container format from the filename extension. Writing to stdout
        # (no extension) makes sndfile default to Sun/NeXT .au — a 24-byte
        # header followed by framed 16-bit PCM. Snapserver is configured
        # for RAW PCM on its FIFO, so it interprets the .au header bytes
        # as audio samples and you get continuous static. There is no
        # `--raw` flag on pw-record to disable this.
        #
        # ffmpeg's `-f pulse` input talks to the PipeWire-pulse compat
        # socket, reads the monitor source directly, and writes clean
        # s16le PCM to stdout. No container, no header, no surprises.

        TARGET="{{.CLI_ARGS}}"

        # Classic footgun guard: a bare numeric id (e.g. `69`) from
        # `wpctl status`. PipeWire sink ids and source ids share one
        # namespace, so targeting `69` when `69` is a Sink hits the wrong
        # side. Reject it with a hint pointing at the monitor.
        if echo "$TARGET" | grep -qE '^[0-9]+$' && command -v wpctl >/dev/null; then
          CLASS=$(wpctl inspect "$TARGET" 2>/dev/null | sed -n 's/.*media.class = "\(.*\)".*/\1/p')
          if [ "$CLASS" = "Audio/Sink" ]; then
            NAME=$(wpctl inspect "$TARGET" 2>/dev/null | sed -n 's/.*node.name = "\(.*\)".*/\1/p')
            echo "Error: id $TARGET is a Sink ($NAME). You want its MONITOR source:"
            echo "  task stream:desktop -- ${NAME}.monitor"
            echo "or just:"
            echo "  task stream:desktop"
            exit 2
          fi
        fi

        # Resolve the target to a concrete Pulse-API source name.
        # `@DEFAULT_MONITOR@` is a PipeWire-only shorthand; ffmpeg's pulse
        # input doesn't understand it, so translate to <default-sink>.monitor.
        if [ -z "$TARGET" ] || [ "$TARGET" = "@DEFAULT_MONITOR@" ]; then
          if command -v wpctl >/dev/null; then
            SINK_NAME=$(wpctl inspect @DEFAULT_AUDIO_SINK@ 2>/dev/null \
                         | sed -n 's/.*node\.name = "\(.*\)".*/\1/p' | head -1)
            if [ -z "$SINK_NAME" ]; then
              echo "Error: could not resolve the default audio sink via wpctl."
              echo "Try: task stream:sources   # pick a monitor source by name"
              exit 2
            fi
            TARGET="${SINK_NAME}.monitor"
          else
            echo "Error: wpctl not found; pass an explicit source name, e.g."
            echo "  task stream:desktop -- alsa_output.pci-0000_00_1f.3.analog-stereo.monitor"
            exit 2
          fi
        fi

        echo "Recording from $TARGET into ${SNAP_FIFO} (via ffmpeg/-f pulse)..."
        exec ffmpeg -hide_banner -loglevel warning \
                    -f pulse -i "$TARGET" \
                    -ac 2 -ar 44100 -f s16le - \
                    > "$(pwd)/{{.SNAP_FIFO}}"

  stream:test:
    desc: Pipe a 440 Hz sine (10 s) into the Desktop FIFO (end-to-end smoke test)
    cmds:
      - mkdir -p {{.SNAP_DIR}}/data
      - |
        ffmpeg -re \
          -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=10" \
          -ac 2 -f s16le - > "{{.SNAP_FIFO}}"

  stream:wav:
    desc: "Pipe a local WAV/MP3/FLAC into the Desktop FIFO. Usage: task stream:wav -- path/to/file"
    cmds:
      - mkdir -p {{.SNAP_DIR}}/data
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Pass a file, e.g.: task stream:wav -- ~/Music/test.flac"
          exit 2
        fi
        ffmpeg -re -i "{{.CLI_ARGS}}" -f s16le -ar 44100 -ac 2 - > "{{.SNAP_FIFO}}"

  # ---------- composite -------------------------------------------------------

  up:
    desc: fw:all + snap:up (full bring-up after a fresh clone; pass PIO_ENV for Louder)
    cmds:
      - task: fw:all
        vars:
          PIO: "{{.PIO}}"
          PIO_ENV: "{{.PIO_ENV}}"
          PIO_PORT: "{{.PIO_PORT}}"
      - task: snap:up

  down:
    desc: Tear everything down (snap only — firmware stays on the device)
    cmds:
      - task: snap:down
