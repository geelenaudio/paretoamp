; PlatformIO Project Configuration File
;
; Four hardware targets share one firmware tree. The compile-time HAL under
; `src/hal/` selects pin maps, DAC drivers, and the EQ backend based on the
; `BOARD_*` symbol passed by the active env. See `docs/board_variants.md`
; and each `docs/hardware/*.md` page for pin diagrams / physical builds.
;
; Envs:
;   amped-esp32-idf     — Amped-ESP32 (WROVER-N8R8), software PEQ (10 bands)
;   amped-esp32s3-idf   — Amped-ESP32-S3 (WROOM-N8R8), software PEQ (10 bands)
;   louder-esp32-idf    — Louder-ESP32-Plus (WROVER-N8R8), HW PEQ via TAS5825M (15 bands)
;   louder-esp32s3-idf  — Louder-ESP32-S3 (WROOM-N8R8), HW PEQ via TAS5825M (15 bands)
;
; The Amped-WROVER env is the only variant validated on-device during the
; refactor. The other three are BUILD-VALIDATED; on-device validation is a
; Phase 10 follow-up (see docs/roadmap.md).

[platformio]
default_envs = amped-esp32-idf

; ---------------------------------------------------------------------------
; Shared fragments. Anything a specific env doesn't override falls through
; to these.

[common]
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
extra_scripts = pre:scripts/build_web.py
; pioarduino 55.03.37 ships ESP-IDF 5.5.2. Unpinned `espressif32` on GitHub
; Actions currently resolves to IDF 6.1, which does not provide the `json`
; (cJSON) component this tree requires.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.37
; The SPIFFS partition is populated from `data/`. Our SPA source lives in
; `web/` and is bundled (gzipped) into `data/web/` by scripts/build_web.py at
; every build.
filesystem = spiffs

; ---------------------------------------------------------------------------
; Native env for host-side unit tests (CI, no device).
;
; Several headers under `src/` expose portable, IDF-free declarations the
; host tests want to link against (event taxonomy in `idf_events.h`,
; Mode FSM policy in `idf_mode_manager.h`). The IDF-specific bits in
; those headers are gated on `ESP_PLATFORM`, which the native env does
; not define, so esp_event / esp_log / NVS are never pulled in.
[env:native]
platform = native
build_src_filter = -<*>
build_flags = -I include -I src

; ---------------------------------------------------------------------------
; Amped-ESP32 with WROVER-N8R8 (the historical / default target).
[env:amped-esp32-idf]
platform = ${common.platform}
board = esp-wrover-kit
framework = espidf
monitor_speed = ${common.monitor_speed}
monitor_port = /dev/ttyUSB0
monitor_filters = ${common.monitor_filters}

build_flags = -DBOARD_AMPED_WROVER=1

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_idf.csv
board_build.sdkconfig_defaults = sdkconfig.defaults,sdkconfig.amped-esp32-idf
board_build.filesystem = ${common.filesystem}
extra_scripts = ${common.extra_scripts}

; ---------------------------------------------------------------------------
; Amped-ESP32-S3 (WROOM-N8R8). Same DAC + amp topology as the WROVER Amped,
; new SoC. Software PEQ. Pin map is a S3-DevKitC-1 default (see
; `src/hal/boards/amped_s3.h`); flash-validated only.
[env:amped-esp32s3-idf]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

build_flags = -DBOARD_AMPED_S3=1

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_idf.csv
board_build.sdkconfig_defaults = sdkconfig.defaults,sdkconfig.amped-esp32s3-idf,sdkconfig.usb_audio
board_build.filesystem = ${common.filesystem}
extra_scripts = ${common.extra_scripts}

; ---------------------------------------------------------------------------
; Louder-ESP32-Plus (WROVER-N8R8) with TAS5825M. Hardware PEQ (15 bands) via
; the vendored sonocotta driver at `components/tas5805m/`.
[env:louder-esp32-idf]
platform = ${common.platform}
board = esp-wrover-kit
framework = espidf
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

build_flags = -DBOARD_LOUDER_WROVER=1

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_idf.csv
board_build.sdkconfig_defaults = sdkconfig.defaults,sdkconfig.louder-esp32-idf
board_build.filesystem = ${common.filesystem}
extra_scripts = ${common.extra_scripts}

; ---------------------------------------------------------------------------
; Louder-ESP32-S3 (WROOM-N8R8) with TAS5825M. Hardware PEQ (15 bands).
[env:louder-esp32s3-idf]
platform = ${common.platform}
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}

build_flags = -DBOARD_LOUDER_S3=1

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_idf.csv
board_build.sdkconfig_defaults = sdkconfig.defaults,sdkconfig.louder-esp32s3-idf,sdkconfig.usb_audio
board_build.filesystem = ${common.filesystem}
extra_scripts = ${common.extra_scripts}
