#
# snapcast-example/snapserver.conf
#
# Minimal override for the sweisgerber/snapcast image (Snapcast 0.35.0).
# Full reference:
#   https://github.com/badaix/snapcast/blob/develop/server/etc/snapserver.conf
#

[server]
datadir = /data/

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780
doc_root = /usr/share/snapweb

[tcp-control]
# JSON-RPC / control. Used by snapweb / CLI controllers (NOT by the ESP32
# Snapclient — that talks to the TCP streaming port 1704 below).
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[tcp-streaming]
# Audio stream the ESP32 Snapclient actually reads from.
bind_to_address = 0.0.0.0
port = 1704

[stream]
# Spotify Connect via the bundled librespot binary. Appears on the LAN as a
# Connect target named `LibreSpot`.
#
# NOTE: newer Spotify accounts currently hit an `error audio key 0 1` from
# Spotify's backend and will never decrypt. If that happens, comment this
# source out and use the `pipe` source below (or enable Airplay via
# `START_AIRPLAY=true` in docker-compose.yml).
source = librespot:///usr/bin/librespot?name=LibreSpot&devicename=LibreSpot&bitrate=320&sampleformat=44100:16:2&cache=%2Fdata%2Flibrespot%2F&params=--zeroconf-port%2022382

# Fallback / bring-up source: anything raw S16LE 44.1 kHz stereo piped into
# ./data/testfifo on the host will play out of the ESP32 amp.
source = pipe:////data/testfifo?name=Desktop&sampleformat=44100:16:2&codec=pcm&mode=create

# Pin the wire format to 44.1 kHz stereo S16LE. This matches the ESP32 I2S
# rate (`geelen::SAMPLE_RATE = 44100`). Leaving this at the image default of
# 48000:16:2 forces a resample inside snapserver.
sampleformat = 44100:16:2
codec = pcm

# End-to-end latency budget. 1000 ms is generous and forgives WiFi jitter
# from the ESP32; lower it if you need tighter lip-sync with video.
buffer = 1000

send_to_muted = false

[streaming_client]
initial_volume = 100

[logging]
# filter = *:info
