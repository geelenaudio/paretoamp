# PlatformIO CI – build Geelen Audio Amp (amped-esp32)
# https://docs.platformio.org/en/latest/integration/ci/github-actions.html

name: PlatformIO CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Helix is vendored (no gitlink). Keep recursive in case a future
          # component is added as a real submodule.
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          # Include the core pin so a previous 6.2 cache cannot sneak back in.
          key: ${{ runner.os }}-pio-6.1.19-${{ hashFiles('ESP32_AudioPlatform/platformio.ini') }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        # 6.2.0 wants tool-scons 4.11.1; pioarduino 55.03.37 wants 4.8.1. Those
        # two delete/reinstall SCons mid-link and fail with
        # `No module named 'SCons.Tool.FortranCommon'`. Local builds use 6.1.19.
        # https://github.com/pioarduino/platform-espressif32/issues/529
        run: pip install --upgrade "platformio==6.1.19"

      - name: Build PlatformIO Project
        run: pio run -e amped-esp32-idf
        working-directory: ESP32_AudioPlatform

      - name: Run native unit tests
        run: pio test -e native
        working-directory: ESP32_AudioPlatform
