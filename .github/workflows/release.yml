# Manual-tag GitHub Release (vMAJOR.MINOR.PATCH). semantic-release on main
# is the usual path (see ci.yml); this workflow is for an explicit tag push.
# If the GitHub Release already exists, bins are uploaded onto it.

name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      firmware_version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: factory-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum *.bin | tee SHA256SUMS.txt

      - name: Release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v${VERSION}"
          prev="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          {
            echo "Pareto Amp **${tag}** factory images (bootloader + partition table + app + SPIFFS website)."
            echo
            echo "Flashing an image at \`0x0\` **wipes NVS** (Wi-Fi credentials, EQ, presets). To keep NVS, use \`task fw:flash\` from a clone of this tag instead."
            echo
            echo "### Flash"
            echo
            echo '```'
            echo "esptool --chip esp32  write-flash 0x0 pareto-amp-amped-esp32-v${VERSION}.bin"
            echo "esptool --chip esp32  write-flash 0x0 pareto-amp-louder-esp32-v${VERSION}.bin"
            echo "esptool --chip esp32s3 write-flash 0x0 pareto-amp-amped-esp32s3-v${VERSION}.bin"
            echo "esptool --chip esp32s3 write-flash 0x0 pareto-amp-louder-esp32s3-v${VERSION}.bin"
            echo '```'
            echo
            echo "Corresponding source: https://github.com/geelenaudio/paretoamp/tree/${tag}"
            echo
            echo "### Changes"
            echo
            if [ -n "${prev}" ]; then
              git log --pretty=format:'- %s' "${prev}..${tag}"
              echo
            else
              echo "First tagged release."
            fi
          } > /tmp/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.bin dist/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" \
              --title "Pareto Amp ${tag}" \
              --notes-file /tmp/release-notes.md \
              dist/*.bin dist/SHA256SUMS.txt
          fi
