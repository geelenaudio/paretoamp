; PlatformIO Project Configuration File
; Target: Amped-ESP32 (non-plus) - ESP32-WROVER-N8R8, PCM5100A DAC, TPA3128 amp
; I2S only (no I2C); same pinout as HiFi-ESP32 / Amped-ESP32 from Sonocotta docs

[platformio]
default_envs = amped-esp32

[env:amped-esp32]
platform = espressif32
board = esp-wrover-kit
framework = arduino
; Pin to 3.3.7 so CI and local both have driver/i2s_std.h (new I2S API)
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
    framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7-libs.tar.xz
monitor_speed = 115200
; Reduce “silent monitor” / stuck-in-reset cases on some USB-UART adapters
monitor_port = /dev/ttyUSB0
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Amped-ESP32 I2S pinout (ESP32): BCK=26, DATA=22, WS(LRCK)=25
; -Wno-cpp: suppress legacy I2S/ADC #warnings from framework headers
; Exclude ESP-IDF entrypoint (built only in the espidf env)
build_src_filter = +<*> -<idf_main.cpp>
build_flags =
    -D PIN_I2S_BCK=26
    -D PIN_I2S_DATA=22
    -D PIN_I2S_WS=25
    -D BOARD_HAS_PSRAM
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    -D CONFIG_ASYNC_TCP_QUEUE_SIZE=32
    -Wno-cpp

; 8MB Flash (match ESP32-WROVER-N8R8); PSRAM enabled by esp32-wrover-kit
board_build.flash_size = 8MB
board_build.psram = enabled
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/me-no-dev/ESPAsyncWebServer#master
    https://github.com/me-no-dev/AsyncTCP#master
    bblanchon/ArduinoJson@^6.21.0

; Native env for host-side unit tests (CI, no device). Portable code in lib/geelen_portable/.
[env:native]
platform = native
build_src_filter = -<*>
build_flags = -I include

; Pure ESP-IDF environment (new)
[env:amped-esp32-idf]
platform = espressif32
board = esp-wrover-kit
framework = espidf
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_filters = esp32_exception_decoder, time

; Use custom partition table + base config for IDF
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_idf.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
