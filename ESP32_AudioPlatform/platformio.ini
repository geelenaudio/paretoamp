; PlatformIO Project Configuration File
; Target: Amped-ESP32 (non-plus) - ESP32-WROVER-N8R8, PCM5100A DAC, TPA3128 amp
; Pure ESP-IDF firmware (I2S pinout: BCK=26, DATA=22, WS=25)

[platformio]
default_envs = amped-esp32-idf

; Native env for host-side unit tests (CI, no device).
;
; Several headers under `src/` expose portable, IDF-free declarations the
; host tests want to link against (event taxonomy in `idf_events.h`,
; Mode FSM policy in `idf_mode_manager.h`). The IDF-specific bits in
; those headers are gated on `ESP_PLATFORM`, which the native env does
; not define, so esp_event / esp_log / NVS are never pulled in.
[env:native]
platform = native
build_src_filter = -<*>
build_flags = -I include -I src

[env:amped-esp32-idf]
platform = espressif32
board = esp-wrover-kit
framework = espidf
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
monitor_filters = esp32_exception_decoder, time

board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions_idf.csv
board_build.sdkconfig_defaults = sdkconfig.defaults

; The SPIFFS partition is populated from `data/`. Our SPA source lives in
; `web/` and is bundled (gzipped) into `data/web/` by scripts/build_web.py
; at every build. Run `pio run -t buildfs -e amped-esp32-idf` to produce the
; SPIFFS image and `pio run -t uploadfs -e amped-esp32-idf` to flash it.
board_build.filesystem = spiffs
extra_scripts = pre:scripts/build_web.py
