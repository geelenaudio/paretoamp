openapi: 3.1.0
info:
  title: Geelen Audio Device API
  summary: On-device REST + SSE API for the Geelen ESP32 audio amplifier.
  description: |
    Every endpoint served at `/api/*` by the firmware. This spec is the single
    source of truth: both the firmware handlers (`src/idf_api.cpp`) and the
    SPA (`web/api.js`) must conform byte-for-byte to the schemas defined
    here.

    The device serves this spec at `GET /openapi.yaml` and an interactive
    Swagger UI at `GET /docs`. Authentication is intentionally absent —
    the device is expected to live on a trusted LAN.

    Legacy compatibility endpoints (`GET /api/status`, `POST /api/source`,
    `GET /api/volume?v=`) are retained as pragma but not documented here;
    they exist only to keep older scripts working and will be removed
    once the SPA fully owns configuration. `POST /api/wifi` is documented
    under the `WiFi` tag — it is still the primary credential-save path.
  version: 0.4.0
  contact:
    name: Geelen Audio
    url: https://github.com/geelen/ESP32_AudioPlatform
  license:
    name: GPL-3.0-or-later
    url: https://www.gnu.org/licenses/gpl-3.0.txt

servers:
  - url: http://geelen.local
    description: Local device (mDNS)
  - url: http://{host}
    description: Arbitrary host / IP
    variables:
      host:
        default: 192.168.1.100
        description: Device hostname or IP.

tags:
  - name: State
    description: Aggregated device state and runtime metrics.
  - name: Audio
    description: Volume, channels, stereo/mono, mode.
  - name: Sources
    description: Per-source configuration (Snapcast, DLNA).
  - name: EQ
    description: |
      Single-layer parametric EQ with per-board runtime cap (10 bands on
      Amped, up to 15 on Louder — Louder uses the TAS5825M's on-chip DSP
      when available, otherwise falls back to the software cascade),
      shared preset store (10 slots), and headroom control.
  - name: Admin
    description: Device name, granular reset.
  - name: WiFi
    description: |
      Wi-Fi onboarding and status. `POST /api/wifi` (form-encoded) is the
      primary credential-save path used by both the AP-mode captive setup
      page and the SPA `/wifi` page. `GET /api/wifi/scan` and
      `GET /api/wifi/state` back those UIs.
  - name: Logs
    description: Live log streaming (SSE).

paths:
  /api/state:
    get:
      tags: [State]
      summary: Aggregated device state
      description: |
        Single round-trip snapshot of everything the SPA needs to render:
        current mode, volume, channel config, Snapcast host, DLNA settings,
        the EQ curve + backend + per-board `max_bands`, headroom settings,
        device name, firmware version.

        SPA fetches this once per page mount; live metrics (CPU / heap /
        WiFi RSSI) live on `GET /api/system` and should be polled
        separately.
      operationId: getState
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceState" }
              example:
                device_name: "Geelen Audio"
                firmware: "0.3.0"
                mode: "snapclient"
                _v: 42
                volume: { l: 70, r: 70, muted: false }
                channels: { stereo_mono: "stereo", l_on: true, r_on: true }
                snapcast: { host: "10.0.80.34", port: 1704 }
                dlna: { enabled: false, name: "Geelen Audio" }
                wifi: { power_save: "none" }
                voice_feedback: true
                eq:
                  enabled: true
                  band_count: 6
                  max_bands: 10
                  backend: "software"
                  bands:
                    - { freq: 60,   gain_db:  3.0, q: 1.00, type: "bell" }
                    - { freq: 200,  gain_db: -1.5, q: 1.20, type: "bell" }
                    - { freq: 1000, gain_db:  0.0, q: 1.20, type: "bell" }
                    - { freq: 4000, gain_db:  2.0, q: 0.90, type: "bell" }
                    - { freq: 8000, gain_db:  2.0, q: 0.80, type: "high_shelf" }
                    - { freq: 12000,gain_db:  1.0, q: 0.80, type: "bell" }
                  headroom: { mode: "auto", manual_db: 0, auto_db: -2.3 }
                  active_slot: 255

  /api/system:
    get:
      tags: [State]
      summary: Runtime metrics
      description: |
        Live snapshot of uptime, free heap, PSRAM, chip info, WiFi link
        status, and CPU load per core. Intended to be polled at ~1 Hz
        while the Overview page is visible.
      operationId: getSystem
      responses:
        "200":
          description: Metrics snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
              example:
                uptime_s: 3725
                free_heap: 131072
                min_free_heap: 98304
                free_psram: 4194304
                chip: { model: "ESP32", revision: 301, cores: 2 }
                wifi:
                  connected: true
                  ssid: "home-5g"
                  rssi: -58
                  channel: 36
                  ip: "10.0.80.34"
                cpu: { core0_pct: 12, core1_pct: 34 }

  /api/system/summary:
    get:
      tags: [State]
      summary: Compact runtime metrics for the Overview page
      description: |
        Same fields as `/api/system/metrics` minus the audio meters.
        Polled at ~0.3 Hz by the Overview page so BT playback is not
        blocked by large JSON serialization.
      operationId: getSystemSummary
      responses:
        "200":
          description: Compact metrics snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }

  /api/system/tasks:
    get:
      tags: [State]
      summary: FreeRTOS task dump
      description: |
        `uxTaskGetSystemState` snapshot: name, priority, stack high-water
        mark, run-time counter, and core id. Requires
        `CONFIG_FREERTOS_USE_TRACE_FACILITY`.
      operationId: getSystemTasks
      responses:
        "200":
          description: Task list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  tasks:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        prio: { type: integer }
                        stack_hwm: { type: integer }
                        runtime: { type: number }
                        runtime_pct: { type: number }
                        core: { type: integer }

  /api/volume:
    post:
      tags: [Audio]
      summary: Set volume / mute
      description: |
        Accepts `{l, r, muted}` for independent channels, or `{v}` to set
        both channels to the same level. Values are clamped to 0..100. If
        both `v` and `l`/`r` are supplied, the per-channel fields win.
      operationId: setVolume
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VolumeSetting" }
            examples:
              ganged: { value: { v: 70, muted: false } }
              split:  { value: { l: 65, r: 72, muted: false } }
              mute:   { value: { muted: true } }
      responses:
        "200":
          description: New effective setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VolumeSetting" }

  /api/channels:
    post:
      tags: [Audio]
      summary: Channel on/off and stereo/mono
      operationId: setChannels
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelSetting" }
            example: { stereo_mono: "stereo", l_on: true, r_on: true }
      responses:
        "200":
          description: New effective setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelSetting" }

  /api/led:
    post:
      tags: [Audio]
      summary: WS2812 colour and brightness
      description: |
        Sets the user colour for every pixel on the compile-time strip
        (`HAL_WS2812_COUNT`). Does not change pixel count. Takes over from
        the boot/pairing status animation immediately.
      operationId: setLed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LedSetting" }
            example: { color: "#ff8800", brightness: 40 }
      responses:
        "200":
          description: Effective LED setting (includes compile-time count and phase).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedState" }
        "404":
          description: This firmware image has no WS2812 (`HAL_HAS_WS2812=0`).

  /api/mode:
    post:
      tags: [Audio]
      summary: Switch audio source
      description: |
        Transitions between `bluetooth`, `snapclient`, and `dlna`. Any edge
        that crosses the `bluetooth` boundary forces a reboot so the BT
        classic stack can be (un)loaded cleanly; the reply indicates
        whether a reboot was scheduled.
      operationId: setMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/Mode" }
            example: { mode: "snapclient" }
      responses:
        "200":
          description: Mode accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { $ref: "#/components/schemas/Mode" }
                  reboot: { type: boolean }

  /api/snapcast:
    post:
      tags: [Sources]
      summary: Configure Snapcast host
      operationId: setSnapcast
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SnapcastSetting" }
            example: { host: "10.0.80.34", port: 1704 }
      responses:
        "200":
          description: New host/port.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapcastSetting" }

  /api/voice-feedback:
    post:
      tags: [Audio]
      summary: Spoken status cues (SPIFFS MP3)
      description: |
        Enables or disables voice prompts (Wi‑Fi/mode at boot, Bluetooth
        connected, pairing). Stored in NVS; takes effect immediately for
        runtime events; boot clips use the setting active when the boot task runs.
      operationId: setVoiceFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceFeedbackSetting" }
            example: { enabled: false }
      responses:
        "200":
          description: New setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoiceFeedbackSetting" }

  /api/dlna:
    post:
      tags: [Sources]
      summary: DLNA renderer settings
      description: |
        Enables or disables the DLNA renderer and optionally renames the
        advertised friendly name. Requires firmware with Phase-9 DLNA
        support for the `enabled: true` path to have any effect.
      operationId: setDlna
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DlnaSetting" }
            example: { enabled: true, name: "Living Room Amp" }
      responses:
        "200":
          description: New settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DlnaSetting" }

  /api/device-name:
    post:
      tags: [Admin]
      summary: Rename the device
      description: |
        User-visible name shown in Snapweb, DLNA announcements, and BT
        advertising. Max 32 bytes UTF-8 (truncated without warning).
      operationId: setDeviceName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 32 } }
            example: { name: "Living Room Amp" }
      responses:
        "200":
          description: New name.
          content:
            application/json:
              schema:
                type: object
                properties: { name: { type: string } }

  /api/eq:
    post:
      tags: [EQ]
      summary: Update the parametric EQ curve
      description: |
        Writes the single parametric curve and/or toggles the EQ enable.
        The device always stores **15** band slots (matches the widest
        supported board); `band_count` selects how many are **active** in
        the DSP. The active count is clamped to `state.eq.max_bands`
        (10 on Amped, up to 15 on Louder). Inactive tail slots are kept
        in NVS but not processed.

        `bands` may be a partial array; entries are merged by index with the
        current curve so the client can send a single edited band.

        Each band has a `type` (`bell`, `low_shelf`, `high_shelf`, `notch`,
        `low_pass`, `high_pass`) and optional `slope_db_oct` (**6**, **12**, or
        **24**) for low-pass / high-pass only.

        The firmware clamps frequencies, gains, and Q before storage. On
        Louder boards the coefficients are pushed to the TAS5825M's on-chip
        DSP; the response's `backend` field reports the actual applied
        backend ("hardware", "software", or "software (fallback)" when the
        HW upload failed and the software cascade took over). The response
        also includes `headroom` (auto attenuation may change when the EQ
        chain changes).
      operationId: setEqCurve
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EqCurveUpdate" }
            example:
              enabled: true
              band_count: 6
              bands:
                - { freq: 60, gain_db: 3.0, q: 1.0, type: "bell" }
                - { freq: 8000, gain_db: 2.0, q: 0.8, type: "high_shelf" }
      responses:
        "200":
          description: The full curve after clamping, plus backend and headroom.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EqCurve"
                  - type: object
                    required: [headroom, backend, max_bands]
                    properties:
                      max_bands:
                        type: integer
                        minimum: 1
                        maximum: 15
                        description: Per-board runtime cap for `band_count`.
                      backend:
                        type: string
                        enum: [software, hardware, "software (fallback)"]
                        description: Which EQ backend is currently applied.
                      headroom: { $ref: "#/components/schemas/HeadroomSetting" }

  /api/eq/headroom:
    post:
      tags: [EQ]
      summary: Set headroom mode and manual cap
      description: |
        In `auto` mode the firmware computes the peak gain of the enabled
        cascade and pre-attenuates to keep total output at or below 0 dB.
        In `manual` mode the user's `manual_db` overrides (must be ≤ 0).
      operationId: setHeadroom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeadroomSetting" }
            example: { mode: "auto", manual_db: 0.0 }
      responses:
        "200":
          description: New setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeadroomSetting" }

  /api/eq/presets:
    get:
      tags: [EQ]
      summary: List EQ preset slots
      operationId: getPresets
      responses:
        "200":
          description: All 10 user slots + factory read-only entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EqPresetList" }

  /api/eq/presets/{idx}/save:
    post:
      tags: [EQ]
      summary: Save the live EQ curve into slot `idx`
      operationId: savePreset
      parameters:
        - $ref: "#/components/parameters/PresetIndex"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string, maxLength: 32 } }
            example: { name: "My bass boost" }
      responses:
        "200":
          description: Slot metadata after save.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EqPresetSlot" }

  /api/eq/presets/{idx}/load:
    post:
      tags: [EQ]
      summary: Replace the live EQ curve with slot `idx`
      operationId: loadPreset
      parameters:
        - $ref: "#/components/parameters/PresetIndex"
      responses:
        "200":
          description: Slot contents + resulting live curve.
          content:
            application/json:
              schema:
                type: object
                properties:
                  index: { type: integer }
                  name: { type: string }
                  eq: { $ref: "#/components/schemas/EqCurve" }
        "404":
          description: Slot is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/eq/presets/{idx}/rename:
    post:
      tags: [EQ]
      summary: Rename an existing preset slot
      operationId: renamePreset
      parameters:
        - $ref: "#/components/parameters/PresetIndex"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string, maxLength: 32 } }
      responses:
        "200":
          description: New slot metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EqPresetSlot" }

  /api/eq/presets/{idx}:
    delete:
      tags: [EQ]
      summary: Clear a preset slot
      operationId: deletePreset
      parameters:
        - $ref: "#/components/parameters/PresetIndex"
      responses:
        "200":
          description: Deletion result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  index: { type: integer }
                  deleted: { type: boolean }

  /api/reset:
    post:
      tags: [Admin]
      summary: Reset a scope of persistent memory
      description: |
        Available scopes: `wifi`, `bluetooth`, `snapcast`, `dlna`, `eq`,
        `audio`, `all`. WiFi and Bluetooth scopes force a reboot; others
        stay live. The `eq` scope also clears all preset slots.
      operationId: resetScope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties: { scope: { $ref: "#/components/schemas/ResetScope" } }
            example: { scope: "snapcast" }
      responses:
        "200":
          description: Reset result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { $ref: "#/components/schemas/ResetScope" }
                  reboot: { type: boolean }
        "400":
          description: Unknown scope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/wifi:
    post:
      tags: [WiFi]
      summary: Save Wi-Fi credentials and reboot
      description: |
        Form-encoded credential save (`application/x-www-form-urlencoded`,
        body `ssid=…&pass=…`). On success the device persists the creds to
        NVS and reboots after ~800 ms. The same handler is used by the
        AP-mode inline setup page (`/`) and by the SPA `/wifi` page.
      operationId: setWifi
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [ssid]
              properties:
                ssid: { type: string, maxLength: 32 }
                pass: { type: string, maxLength: 64, description: "WPA2 PSK; omit to keep current password." }
      responses:
        "200":
          description: Credentials saved; device is rebooting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }

  /api/wifi/validate:
    post:
      tags: [WiFi]
      summary: Probe Wi-Fi credentials without persisting
      description: |
        JSON `{ssid, pass}`. Tries STA while keeping the captive AP up.
        Does not write NVS and does not reboot. Timeout is 12 s.
      operationId: validateWifi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ssid]
              properties:
                ssid: { type: string, maxLength: 32 }
                pass: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Probe result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reason: { type: string, enum: [OK, AUTH_FAIL, NO_AP_FOUND, ASSOC_FAIL, TIMEOUT, FAIL] }
                  detail: { type: string }
                  ip: { type: string }

  /api/wifi/commit:
    post:
      tags: [WiFi]
      summary: Persist last successful validate and reboot
      operationId: commitWifi
      responses:
        "200":
          description: Saved; rebooting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  reboot: { type: boolean }
        "400":
          description: No successful validate in this session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/wifi/scan:
    get:
      tags: [WiFi]
      summary: Scan nearby Wi-Fi networks
      description: |
        Synchronous active scan (~3 s). Requires the radio to be in STA or
        APSTA mode; the AP-fallback uses APSTA so this works during
        onboarding. Returns up to 24 entries, deduplicated by SSID and
        sorted by RSSI descending.
      operationId: getWifiScan
      responses:
        "200":
          description: Scan results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks:
                    type: array
                    items: { $ref: "#/components/schemas/WifiNetwork" }
              example:
                networks:
                  - { ssid: "home-5g",  rssi: -52, channel: 36, auth: 4 }
                  - { ssid: "neighbor", rssi: -78, channel: 6,  auth: 3 }
        "500":
          description: Scan failed (radio in wrong mode or driver error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/wifi/state:
    get:
      tags: [WiFi]
      summary: Current Wi-Fi link state
      description: |
        Snapshot of STA + AP state. The SPA Overview page reads this to
        decide whether to render the "Setup hotspot active" banner; the
        `/wifi` page uses it for the status header.
      operationId: getWifiState
      responses:
        "200":
          description: Current Wi-Fi state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WifiState" }
              example:
                ap_only: false
                ap_running: false
                sta_connected: true
                ssid: "home-5g"
                rssi: -58
                channel: 36
                ip: "10.0.80.34"
                ap_ssid: ""
                ap_ip: "0.0.0.0"

  /api/wifi/power-save:
    post:
      tags: [WiFi]
      summary: Set Wi-Fi power-save mode (Phase 5)
      description: |
        Selects `esp_wifi_set_ps` policy. Persisted in NVS, applied on next
        boot — the firmware deliberately does NOT hot-apply because flipping
        `esp_wifi_set_ps` mid-stream interacts poorly with active BT coex
        (drops PCM frames).

        The default `none` is the right answer for any device that streams
        audio; `min_modem` saves ≈30–80 mA at the cost of a few ms of inbound
        latency, and `max_modem` causes audible glitches on this hardware
        and exists only for completeness.
      operationId: setWifiPowerSave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [none, min_modem, max_modem]
            example: { mode: "min_modem" }
      responses:
        "200":
          description: New mode persisted; reboot to apply.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:                  { type: string, enum: [none, min_modem, max_modem] }
                  applies_on_next_boot:  { type: boolean }
              example:
                mode: "min_modem"
                applies_on_next_boot: true
        "400":
          description: "`mode` missing or not in the enum."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/logs/stream:
    get:
      tags: [Logs]
      summary: Live log event stream (SSE)
      description: |
        Server-Sent Events stream of device log lines. The server first
        replays the current ring buffer, then pushes each new entry as it
        is logged. Only one active subscriber is allowed — a second
        `EventSource` will close the first.

        Each SSE `data:` field is a single JSON object matching
        `#/components/schemas/LogEntry`.
      operationId: streamLogs
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/LogEntry" }

components:
  parameters:
    PresetIndex:
      name: idx
      in: path
      required: true
      schema: { type: integer, minimum: 0, maximum: 9 }
      description: Preset slot index (0..9).

  schemas:
    Mode:
      type: string
      enum: [bluetooth, snapclient, dlna]
      description: Active audio source.

    VolumeSetting:
      type: object
      properties:
        l: { type: integer, minimum: 0, maximum: 100 }
        r: { type: integer, minimum: 0, maximum: 100 }
        v:
          type: integer
          minimum: 0
          maximum: 100
          description: Convenience scalar — sets both channels.
        muted: { type: boolean }
        volume:
          type: integer
          description: Legacy scalar reflected from max(l, r). Read-only on responses.

    ChannelSetting:
      type: object
      properties:
        stereo_mono: { type: string, enum: [stereo, mono] }
        l_on: { type: boolean }
        r_on: { type: boolean }

    LedSetting:
      type: object
      properties:
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: sRGB hex. Omitted fields keep the current value.
        brightness:
          type: integer
          minimum: 0
          maximum: 100

    LedState:
      type: object
      properties:
        present: { type: boolean }
        count:
          type: integer
          minimum: 0
          maximum: 64
          description: Compile-time `HAL_WS2812_COUNT`. Read-only.
        phase:
          type: string
          enum: [boot, wifi, pairing, user]
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        brightness: { type: integer, minimum: 0, maximum: 100 }

    SnapcastSetting:
      type: object
      properties:
        host: { type: string, maxLength: 64 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 1704 }

    DlnaSetting:
      type: object
      properties:
        enabled: { type: boolean }
        name: { type: string, maxLength: 32 }

    VoiceFeedbackSetting:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    EqBand:
      type: object
      description: |
        One EQ band. Frequency is `freq` (not `freq_hz`) on the wire. For
        `notch`, gain is ignored at runtime. For `low_pass` / `high_pass`,
        `slope_db_oct` selects 6 / 12 / 24 dB/oct (first-order or RBJ stacks);
        `gain_db` is ignored for those types. `q` is not used for 6 dB/oct
        LP/HP (single-pole); for 12/24 dB/oct the implementation uses a
        Butterworth Q (~0.707) internally.
      required: [freq, gain_db, q]
      properties:
        freq:    { type: number, minimum: 20,  maximum: 20000, description: "Centre or corner frequency in Hz" }
        gain_db: { type: number, minimum: -18, maximum: 18, description: "Gain in dB (bell / shelves; ignored for notch and LP/HP)" }
        q:       { type: number, minimum: 0.1, maximum: 100.0, description: "Quality factor (notch may use higher Q; LP/HP use fixed Q for 12/24 dB/oct)" }
        type:
          type: string
          enum: [bell, low_shelf, high_shelf, notch, low_pass, high_pass]
          default: bell
        slope_db_oct:
          type: integer
          enum: [6, 12, 24]
          default: 12
          description: "Rolloff for low_pass and high_pass only."

    EqCurve:
      type: object
      properties:
        enabled: { type: boolean }
        band_count:
          type: integer
          minimum: 1
          maximum: 15
          description: |
            Number of logical bands processed. Clamped to the per-board
            runtime cap (`state.eq.max_bands`, 10 on Amped, up to 15 on
            Louder). Inactive tail slots are stored but not applied.
        bands:
          type: array
          minItems: 15
          maxItems: 15
          description: |
            Always 15 entries (fits the widest supported board). Only the
            first `band_count` are active in DSP; the remainder are stored
            for round-tripping preset files across boards.
          items: { $ref: "#/components/schemas/EqBand" }

    EqCurveUpdate:
      type: object
      description: |
        Partial update payload accepted by `POST /api/eq`. All fields are
        optional; the firmware merges into the current live curve. `bands`
        is index-merged, so the client can send a single edited band.
      properties:
        enabled: { type: boolean }
        band_count:
          type: integer
          minimum: 1
          maximum: 15
          description: Active logical bands; clamped to `state.eq.max_bands`.
        bands:
          type: array
          items: { $ref: "#/components/schemas/EqBand" }

    HeadroomSetting:
      type: object
      properties:
        mode: { type: string, enum: [auto, manual] }
        manual_db:
          type: number
          maximum: 0
          description: User cap in dB (must be ≤ 0, enforced server-side).
        auto_db:
          type: number
          maximum: 0
          description: Computed peak gain in dB. Response-only; ignored on requests.

    EqPresetSlot:
      type: object
      properties:
        index: { type: integer, minimum: 0, maximum: 9 }
        name:  { type: string }
        saved: { type: boolean }

    EqPresetList:
      type: object
      properties:
        active:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 9
            - type: "null"
          description: Slot currently loaded into the live curve, or null if unsaved/modified.
        slots:
          type: array
          minItems: 10
          maxItems: 10
          items: { $ref: "#/components/schemas/EqPresetSlot" }
        factory:
          type: array
          items:
            type: object
            properties: { name: { type: string } }

    ResetScope:
      type: string
      enum: [wifi, bluetooth, snapcast, dlna, eq, audio, all, factory]

    DeviceState:
      type: object
      properties:
        device_name: { type: string }
        firmware:    { type: string }
        mode:        { $ref: "#/components/schemas/Mode" }
        volume:      { $ref: "#/components/schemas/VolumeSetting" }
        channels:    { $ref: "#/components/schemas/ChannelSetting" }
        led:         { $ref: "#/components/schemas/LedState" }
        snapcast:    { $ref: "#/components/schemas/SnapcastSetting" }
        dlna:        { $ref: "#/components/schemas/DlnaSetting" }
        wifi:        { $ref: "#/components/schemas/WifiSetting" }
        voice_feedback: { type: boolean, description: "Cached PSRAM voice cues (boot + BT events)." }
        _v:
          type: integer
          description: |
            Monotonic state version. Bumped on every persisted mutation; used
            by the `/api/state/stream` SSE consumer (and as an ETag analogue
            on `/api/state`) so SPA clients can detect skipped frames.
        eq:
          allOf:
            - $ref: "#/components/schemas/EqCurve"
            - type: object
              properties:
                max_bands:
                  type: integer
                  minimum: 1
                  maximum: 15
                  description: |
                    Per-board runtime cap for `band_count`. 10 on Amped
                    (software cascade), up to 15 on Louder (TAS5825M
                    on-chip DSP or software fallback).
                backend:
                  type: string
                  enum: [software, hardware, "software (fallback)"]
                  description: Which EQ backend is currently applied.
                headroom: { $ref: "#/components/schemas/HeadroomSetting" }
                active_slot:
                  type: integer
                  description: Slot index currently loaded, or 255 if the live curve is unsaved/modified.

    WifiSetting:
      type: object
      description: |
        Persisted Wi-Fi configuration knobs surfaced in the device state
        snapshot. Live STA status (RSSI, IP, AP fallback) lives on
        `GET /api/wifi/state` instead — that endpoint is not part of the
        push-based snapshot because the values change too often.
      properties:
        power_save:
          type: string
          enum: [none, min_modem, max_modem]
          description: |
            `esp_wifi_set_ps` policy applied at boot. See
            `POST /api/wifi/power-save` for the trade-offs.

    SystemInfo:
      type: object
      properties:
        uptime_s:      { type: number }
        free_heap:     { type: integer }
        min_free_heap: { type: integer }
        free_psram:    { type: integer }
        chip:
          type: object
          properties:
            model:    { type: string }
            revision: { type: integer }
            cores:    { type: integer }
        wifi:
          type: object
          properties:
            connected: { type: boolean }
            ssid:      { type: string }
            rssi:      { type: integer, description: "dBm" }
            channel:   { type: integer }
            ip:        { type: string }
        cpu:
          type: object
          properties:
            core0_pct: { type: integer, minimum: 0, maximum: 100 }
            core1_pct: { type: integer, minimum: 0, maximum: 100 }
        firmware:
          type: object
          description: Build-time identity of the running image.
          properties:
            version:    { type: string, example: "0.3.0" }
            project:    { type: string, example: "geelen_amp" }
            build_date: { type: string, example: "Apr 19 2026" }
            build_time: { type: string, example: "12:34:56" }
            idf_ver:    { type: string, example: "v5.1.2" }
            elf_sha256: { type: string, description: "64-hex-char ELF checksum" }
        net:
          type: object
          description: Network identity of the device.
          properties:
            hostname: { type: string }
            sta_mac:  { type: string, example: "aa:bb:cc:11:22:33" }
            ap_mac:   { type: string }
            bt_mac:   { type: string }

    LogEntry:
      description: |
        The SSE stream frames are JSON objects of shape `{t, line}` where
        `line` is the raw ESP-IDF log line (including level/tag prefix).
        Clients may parse `line` themselves if they want level/tag fields.
      type: object
      properties:
        t:    { type: integer, description: "Device uptime in ms" }
        line: { type: string, description: "Raw log line, ANSI-stripped on the client" }

    WifiNetwork:
      type: object
      properties:
        ssid:    { type: string, maxLength: 32 }
        rssi:    { type: integer, description: "dBm; typical -30 (close) to -90 (weak)" }
        channel: { type: integer, description: "Primary channel" }
        auth:
          type: integer
          description: |
            wifi_auth_mode_t enum from esp-idf:
            0=open, 1=WEP, 2=WPA-PSK, 3=WPA2-PSK, 4=WPA/WPA2-PSK,
            5=Enterprise, 6=WPA3-PSK, 7=WPA2/WPA3-PSK, 8=WAPI.

    WifiState:
      type: object
      properties:
        ap_only:       { type: boolean, description: "AP fallback is up and STA has no IP yet." }
        ap_running:    { type: boolean }
        sta_connected: { type: boolean }
        ssid:          { type: string, description: "STA SSID (when connected)" }
        rssi:          { type: integer }
        channel:       { type: integer }
        ip:            { type: string, description: "STA IPv4 dotted-quad; '0.0.0.0' when not connected" }
        ap_ssid:       { type: string, description: "AP fallback SSID (when ap_running)" }
        ap_ip:         { type: string, description: "AP fallback IPv4 (typically 192.168.4.1)" }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
