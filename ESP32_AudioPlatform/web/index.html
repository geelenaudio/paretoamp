<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#16181A" />
  <title>Geelen Audio</title>
  <link rel="icon" href="/logo/geelen_audio.svg" type="image/svg+xml" />
  <!--
    Theme bootstrap. Runs before app.css is parsed so the first paint is
    already the correct palette (no flash of dark-on-light or vice versa).
    Order: explicit localStorage choice -> dark default (brand).
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("ga-theme");
        var theme = (saved === "light" || saved === "dark") ? saved : "dark";
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <noscript>
    <p style="color:#FFFCF2;background:#16181A;padding:2rem;font:16px system-ui;">
      This control panel requires JavaScript.
    </p>
  </noscript>
  <div id="app"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
